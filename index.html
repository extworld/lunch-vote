<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 점심 메뉴 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
    .bar-transition {
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 0.3s ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-orange-50/30 to-amber-50/40 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    
    <!-- Header -->
    <header class="bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 px-6 py-8 text-white text-center relative overflow-hidden">
      <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-white/15 rounded-full blur-2xl"></div>
      <div class="absolute -left-12 -top-12 w-48 h-48 bg-white/15 rounded-full blur-2xl"></div>
      
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/20 text-white backdrop-blur-md mb-3 shadow-sm">
        <i class="fa-solid fa-utensils"></i> 점심 뭐 먹지?
      </span>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">실시간 점심메뉴 투표</h1>
      <p class="text-orange-100 text-sm mt-2 max-w-md mx-auto">
        오늘의 점심 메뉴를 골라주세요! 비빔밥, 돈가스, 국밥, 샐러드 중 여러분의 선택은?
      </p>
    </header>

    <div class="p-6 sm:p-8 space-y-7">
      
      <!-- Menu Selection Area -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-orange-100 text-orange-600 text-xs font-bold">1</span>
            메뉴 선택하기
          </h2>
          <span class="text-xs text-slate-400">원하는 메뉴를 터치하여 선택하세요</span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4" id="menuGrid">
          
          <!-- 1. 비빔밥 -->
          <div class="menu-card group relative p-4 rounded-2xl border-2 border-slate-200 hover:border-orange-400 hover:shadow-md cursor-pointer transition-all duration-200 bg-white flex flex-col justify-between"
               data-id="1" onclick="selectMenu(1)">
            <div class="flex items-start justify-between">
              <div class="w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                🍚
              </div>
              <div class="check-icon w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-white text-xs transition-colors">
                <i class="fa-solid fa-check opacity-0 check-mark"></i>
              </div>
            </div>
            <div class="mt-4">
              <span class="text-[11px] font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md">든든한 한식</span>
              <h3 class="font-bold text-slate-800 text-base sm:text-lg mt-1">비빔밥</h3>
              <p class="text-xs text-slate-400 mt-0.5">신선한 나물과 고추장</p>
            </div>
          </div>

          <!-- 2. 돈가스 -->
          <div class="menu-card group relative p-4 rounded-2xl border-2 border-slate-200 hover:border-orange-400 hover:shadow-md cursor-pointer transition-all duration-200 bg-white flex flex-col justify-between"
               data-id="2" onclick="selectMenu(2)">
            <div class="flex items-start justify-between">
              <div class="w-12 h-12 rounded-2xl bg-orange-50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                🍱
              </div>
              <div class="check-icon w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-white text-xs transition-colors">
                <i class="fa-solid fa-check opacity-0 check-mark"></i>
              </div>
            </div>
            <div class="mt-4">
              <span class="text-[11px] font-semibold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md">바삭바삭 일식</span>
              <h3 class="font-bold text-slate-800 text-base sm:text-lg mt-1">돈가스</h3>
              <p class="text-xs text-slate-400 mt-0.5">겉바속촉 수제 돈가스</p>
            </div>
          </div>

          <!-- 3. 국밥 -->
          <div class="menu-card group relative p-4 rounded-2xl border-2 border-slate-200 hover:border-orange-400 hover:shadow-md cursor-pointer transition-all duration-200 bg-white flex flex-col justify-between"
               data-id="3" onclick="selectMenu(3)">
            <div class="flex items-start justify-between">
              <div class="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                🍲
              </div>
              <div class="check-icon w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-white text-xs transition-colors">
                <i class="fa-solid fa-check opacity-0 check-mark"></i>
              </div>
            </div>
            <div class="mt-4">
              <span class="text-[11px] font-semibold text-red-600 bg-red-50 px-2 py-0.5 rounded-md">뜨끈한국물</span>
              <h3 class="font-bold text-slate-800 text-base sm:text-lg mt-1">국밥</h3>
              <p class="text-xs text-slate-400 mt-0.5">진한 육수의 영혼 보양식</p>
            </div>
          </div>

          <!-- 4. 샐러드 -->
          <div class="menu-card group relative p-4 rounded-2xl border-2 border-slate-200 hover:border-orange-400 hover:shadow-md cursor-pointer transition-all duration-200 bg-white flex flex-col justify-between"
               data-id="4" onclick="selectMenu(4)">
            <div class="flex items-start justify-between">
              <div class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                🥗
              </div>
              <div class="check-icon w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-white text-xs transition-colors">
                <i class="fa-solid fa-check opacity-0 check-mark"></i>
              </div>
            </div>
            <div class="mt-4">
              <span class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">가벼운 건강식</span>
              <h3 class="font-bold text-slate-800 text-base sm:text-lg mt-1">샐러드</h3>
              <p class="text-xs text-slate-400 mt-0.5">프레시한 채소 & 닭가슴살</p>
            </div>
          </div>

        </div>
      </section>

      <!-- Action Button Area -->
      <section class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50/80 border border-slate-200">
        <div class="text-sm text-slate-600 flex items-center gap-2">
          <i class="fa-solid fa-hand-pointer text-orange-500"></i>
          <span id="selectedLabel" class="font-medium text-slate-700">메뉴를 선택해주세요.</span>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
          <button id="voteBtn" onclick="castVote()"
                  class="flex-1 sm:flex-initial px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-bold text-sm shadow-md shadow-orange-200 transition-all duration-150 flex items-center justify-center gap-2">
            <i class="fa-solid fa-check-to-slot"></i>
            투표하기
          </button>
          
          <button onclick="resetVotes()" title="투표 결과 초기화"
                  class="p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-500 hover:text-slate-700 text-sm transition-colors">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </section>

      <!-- Results Area -->
      <section class="border-t border-slate-100 pt-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-orange-100 text-orange-600 text-xs font-bold">2</span>
            <h2 class="text-base sm:text-lg font-bold text-slate-800">실시간 투표 결과</h2>
          </div>
          <div class="text-xs font-semibold text-slate-600 bg-orange-50 border border-orange-200/60 px-3 py-1 rounded-full">
            총 참여: <span id="totalVotes" class="font-bold text-orange-600">0</span>표
          </div>
        </div>

        <!-- Result Bars Container -->
        <div class="space-y-3.5" id="resultsContainer">
          <!-- Dynamically populated -->
        </div>
      </section>

    </div>

    <!-- Footer Note -->
    <footer class="bg-slate-50 border-t border-slate-100 py-3 px-6 text-center text-xs text-slate-400">
      실시간 집계 & 1위 메뉴 자동 하이라이트
    </footer>

  </div>

  <script>
    const menus = [
      { id: 1, name: '비빔밥', emoji: '🍚', colorBg: 'bg-amber-500', votes: 0 },
      { id: 2, name: '돈가스', emoji: '🍱', colorBg: 'bg-orange-500', votes: 0 },
      { id: 3, name: '국밥',   emoji: '🍲', colorBg: 'bg-red-500',    votes: 0 },
      { id: 4, name: '샐러드', emoji: '🥗', colorBg: 'bg-emerald-500',votes: 0 }
    ];

    let selectedId = 1; // 기본 비빔밥 선택

    function selectMenu(id) {
      selectedId = id;
      const selected = menus.find(m => m.id === id);

      document.querySelectorAll('.menu-card').forEach(card => {
        const cardId = parseInt(card.getAttribute('data-id'));
        const checkIcon = card.querySelector('.check-icon');
        const checkMark = card.querySelector('.check-mark');

        if (cardId === id) {
          card.classList.remove('border-slate-200');
          card.classList.add('border-orange-500', 'bg-orange-50/20', 'ring-2', 'ring-orange-100');
          checkIcon.classList.remove('border-slate-300');
          checkIcon.classList.add('bg-orange-500', 'border-orange-500');
          checkMark.classList.remove('opacity-0');
        } else {
          card.classList.add('border-slate-200');
          card.classList.remove('border-orange-500', 'bg-orange-50/20', 'ring-2', 'ring-orange-100');
          checkIcon.classList.add('border-slate-300');
          checkIcon.classList.remove('bg-orange-500', 'border-orange-500');
          checkMark.classList.add('opacity-0');
        }
      });

      document.getElementById('selectedLabel').innerHTML = `
        선택: <span class="text-orange-600 font-bold">${selected.emoji} ${selected.name}</span>
      `;
    }

    function castVote() {
      if (!selectedId) {
        alert('투표할 메뉴를 선택해주세요!');
        return;
      }

      const target = menus.find(m => m.id === selectedId);
      if (target) {
        target.votes++;
        renderResults();

        // Button Click Animation
        const btn = document.getElementById('voteBtn');
        btn.classList.add('animate-pop');
        setTimeout(() => btn.classList.remove('animate-pop'), 300);
      }
    }

    function resetVotes() {
      if (confirm('투표 결과를 초기화하시겠습니까?')) {
        menus.forEach(m => m.votes = 0);
        renderResults();
      }
    }

    function renderResults() {
      const total = menus.reduce((sum, item) => sum + item.votes, 0);
      document.getElementById('totalVotes').innerText = total;

      const maxVotes = Math.max(...menus.map(m => m.votes));
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      menus.forEach(item => {
        const percent = total > 0 ? ((item.votes / total) * 100).toFixed(1) : '0.0';
        const isLeading = total > 0 && item.votes === maxVotes && item.votes > 0;

        const row = document.createElement('div');
        row.className = `p-3.5 rounded-2xl border transition-all ${
          isLeading ? 'border-orange-200 bg-orange-50/30 shadow-sm' : 'border-slate-100 bg-white'
        }`;
        row.innerHTML = `
          <div class="flex items-center justify-between text-sm mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xl">${item.emoji}</span>
              <span class="font-bold text-slate-800">${item.name}</span>
              ${isLeading ? '<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-700 flex items-center gap-1"><i class="fa-solid fa-crown text-amber-500"></i> 1위</span>' : ''}
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-medium text-slate-400">${item.votes}표</span>
              <span class="text-sm font-extrabold text-slate-700 w-12 text-right">${percent}%</span>
            </div>
          </div>
          <!-- Progress Bar -->
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full ${item.colorBg} bar-transition" style="width: ${percent}%;"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Init state
    selectMenu(1);
    renderResults();
  </script>
</body>
</html>
